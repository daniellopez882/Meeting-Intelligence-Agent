name: CI

# There was no pipeline. The repository also had a committed .env holding a
# live API key, so the secret scan below is the point of this file as much as
# the tests are.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      - name: Tests
        env:
          ENVIRONMENT: testing
          API_KEY: ci-test-key-not-real
        run: pytest -q

      - name: No .env may be tracked
        # A .env holding a live DeepSeek key was committed here. Blanking the
        # value in a later commit left it readable in history.
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked; it must never be committed"
            exit 1
          fi
          echo "clean"

      - name: No key-shaped strings in the working tree
        run: |
          hits=$(git grep -nIE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' \
                   -- . ':(exclude).github' ':(exclude)*.md' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::a credential-shaped string is committed"
            exit 1
          fi
          echo "clean"

      - name: Bandit
        # Runs at medium severity and above, and fails the job. It used to be
        # continue-on-error, which is a check that cannot fail.
        run: bandit -r src -ll -f screen

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        # Scans history, not just the tip. The key in this repository was
        # removed from the file but remains in an earlier commit.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  docker:
    name: Container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t meeting-intelligence:ci .

      - name: The image must not run as root
        run: |
          uid=$(docker run --rm --entrypoint id meeting-intelligence:ci -u)
          [ "$uid" != "0" ] || { echo "::error::container runs as root"; exit 1; }
          echo "runs as uid $uid"

      - name: Production on the placeholder API key must not start
        run: |
          set +e
          docker run --rm -e ENVIRONMENT=production -e API_KEY=changeme-in-production \
            -e ANTHROPIC_API_KEY=ci-not-real -e CORS_ALLOW_ORIGINS=https://example.com \
            meeting-intelligence:ci
          code=$?
          set -e
          [ "$code" != "0" ] || { echo "::error::container started on the placeholder key"; exit 1; }
          echo "refused with exit $code"

      - name: Serve and answer /health, /ready and /
        run: |
          docker run -d --name mi -p 8000:8000 -e ENVIRONMENT=testing -e API_KEY=ci-test-key-not-real meeting-intelligence:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          echo
          curl -sS http://127.0.0.1:8000/ready
          echo
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)
          [ "$code" = "200" ] || { echo "::error::dashboard not served (got $code)"; exit 1; }
          docker logs mi | tail -10
          docker rm -f mi
