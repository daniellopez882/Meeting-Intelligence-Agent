name: CI

# There was no pipeline. The repository also had a committed .env holding a
# live API key, so the secret scan below is the point of this file as much as
# the tests are.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

      - name: Tests
        env:
          ENVIRONMENT: testing
          API_KEY: ci-test-key-not-real
        run: pytest -q

      - name: No .env may be tracked
        # A .env holding a live DeepSeek key was committed here. Blanking the
        # value in a later commit left it readable in history.
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked; it must never be committed"
            exit 1
          fi
          echo "clean"

      - name: No key-shaped strings in the working tree
        run: |
          hits=$(git grep -nIE '(sk-[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' \
                   -- . ':(exclude).github' ':(exclude)*.md' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::a credential-shaped string is committed"
            exit 1
          fi
          echo "clean"

      - name: Bandit
        run: bandit -r src -ll -f screen
        continue-on-error: true

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        # Scans history, not just the tip. The key in this repository was
        # removed from the file but remains in an earlier commit.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
